<html>
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form method="post" action="">
        <fieldset>
            <legend>text input</legend>
            <label>name</label>
            <input type="text" name="name" id="name" placeholder="enter your name" required>
            </br>
            <label>password</label>
            <input type="password" name="password" id="password" placeholder="enter your password" required>
            </br>
            <label>Email</label>
            <input type="email" name="email" id="email" placeholder="enter your email" required>
        </fieldset>
        <fieldset>
            <legend>file and range</legend>
            <label>file</label>
            <input type="file" name="file" id="file">
            </br>
            <label>range</label>
            <input type="range" name="range" id="range">
        </fieldset>
        <fieldset>
            <legend>radio</legend>
            <input type="radio" name="size" id="small" value="s">
            <label for="small">small</label>
            <input type="radio" name="size" id="medium" value="m">
            <label for="medium">medium</label>
            <input type="radio" name="size" id="large" value="l">
            <label for="large">large</label>
        </fieldset>
        <fieldset>
            <legend>chekbox</legend>
            <input type="checkbox" name="topics" id="html" value="html">
            <label for="html">html</label>
            <input type="checkbox" name="topics" id="css" value="css">
            <label for="css">css</label>
            <input type="checkbox" name="topics" id="JavaScript" value="JavaScript">
            <label for="JavaScript">JavaScript</label>
        </fieldset>
        <fieldset>
            <legend name="select" id="select"></legend>
            <label for="country">Country</label>
            <select id="country" name="country">
            <option value="il">Israel</option>
            <option value="us">US</option>
            <option value="ja">Japan</option>
            <option value="it">Italy</option>
        </select>
        </fieldset>
        <button type="submit">send</button>

    </form>
</body>

</html>

</html>
